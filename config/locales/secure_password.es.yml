# [turuta] Chatwoot solo trae estos mensajes en ingles y en chino. Son los que
# devuelve el servidor cuando una contrasena no cumple los requisitos. La
# interfaz ya los valida antes de enviar (turuta/contrasena.js), asi que esto es
# la red de seguridad: si aun asi llega un error, llega en espanol.
# Con el nombre del campo de turuta.es.yml se lee:
#   "La contraseña debe tener al menos 1 carácter numérico"
es:
  secure_password:
    character:
      one: "carácter"
      other: "caracteres"

    types:
      uppercase: "en mayúscula"
      downcase: "en minúscula"
      lowercase: "en minúscula"
      number: "numérico"
      special: "especial"

    password_has_required_content:
      errors:
        messages:
          unknown_characters: "contiene %{count} %{subject} no válidos"
          minimum_characters: "debe tener al menos %{count} %{subject} %{type}"
          maximum_characters: "debe tener menos de %{count} %{subject} %{type}"
          minimum_length: "debe tener al menos %{count} %{subject}"
          maximum_length: "debe tener menos de %{count} %{subject}"
    password_disallows_frequent_reuse:
      errors:
        messages:
          password_is_recent: "No se pueden repetir las últimas %{count} contraseñas"
    password_disallows_frequent_changes:
      errors:
        messages:
          password_is_recent: "La contraseña no se puede cambiar más de una vez cada %{timeframe}"
    password_requires_regular_updates:
      alerts:
        messages:
          password_updated: "Tu contraseña se ha actualizado."
      errors:
        messages:
          password_expired: "Tu contraseña ha caducado. Hay que cambiarla cada %{timeframe}"
