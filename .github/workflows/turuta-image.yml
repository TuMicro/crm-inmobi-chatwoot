# Construye NUESTRA imagen de Chatwoot y la publica en GHCR.
#
# Es una copia de publish_ee_docker.yml de Chatwoot, reducida: misma edicion
# ("ee", que es lo que lleva la imagen oficial chatwoot/chatwoot:vX.Y.Z sin
# sufijo), solo linux/amd64 (la VM es x86) y con cache de capas para que la
# segunda construccion no tarde otros 30 minutos.
#
# Etiquetas que produce:
#   ghcr.io/tumicro/chatwoot:4.17.1-N    al empujar un tag "4.17.1-N"  <- la que se despliega
#   ghcr.io/tumicro/chatwoot:turuta-main al empujar a la rama          <- para probar
#
# El numero final (-N) es nuestro: sube con cada cambio de interfaz sin tocar
# la version de Chatwoot. Ver docs/10-plan-fork-ui.md en crm-inmobi.
name: Imagen ghcr.io/tumicro/chatwoot

on:
  push:
    branches: [turuta/main]
    # Nuestras etiquetas empiezan por numero (4.17.1-1). Las de Chatwoot, por v.
    tags: ['[0-9]*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tumicro/chatwoot

permissions:
  contents: read
  packages: write

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construir y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Igual que hace Chatwoot para su imagen sin sufijo.
      - name: Fijar la edicion
        run: echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=turuta-main,enable=${{ github.ref == 'refs/heads/turuta/main' }}
            type=sha,prefix=git-

      - uses: docker/setup-buildx-action@v3

      - name: Entrar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
